site_name: שאלות ראיון DV
site_description: אוסף שאלות ראיון עבודה ב-Design Verification עם פתרונות מלאים
site_url: https://tamirgabgab.github.io/DV-Interview-Questions/
repo_url: https://github.com/tamirgabgab/DV-Interview-Questions
repo_name: DV-Interview-Questions
edit_uri: edit/main/docs/

theme:
  name: material
  # overrides/: main.html adds the web app manifest (home-screen icon), 404.html the
  # Hebrew "page not found" page, partials/content.html the edit link at the page end
  custom_dir: overrides
  language: he
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Rubik
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: מצב כהה
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: מצב בהיר
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

copyright: >
  שאלות ראיון DV &middot;
  <a href="https://github.com/tamirgabgab/DV-Interview-Questions">קוד המקור ב-GitHub</a>

extra:
  generator: false
  # Questions moved to a new number: the 404 page sends an old address to the new one (the
  # same level and slug, the new id), and docs/javascripts/marks.js moves the marks saved in
  # the browser once (keep its RENUMBERED list in step with this one).
  dvq_renumbered:
    "0056": "0057"
    "0057": "0058"
    "0058": "0059"
    "0059": "0060"
    "0060": "0061"
    "0061": "0062"
  # Comments per question through GitHub Discussions (giscus). Empty ids keep the section
  # off; CONTRIBUTING.md ("Comments") says how to fill them in once Discussions is enabled.
  comments:
    repo: tamirgabgab/DV-Interview-Questions
    repo_id: ""
    category: Announcements
    category_id: ""

plugins:
  - search:
      lang: en          # Hebrew prefix letters: see on_post_build in hooks/questions.py
  - tags
  # Social preview cards (one PNG per page, linked from og:image); the layout is RTL and
  # lives in layouts/dvq.yml. Needs pillow + cairosvg (requirements.txt); fonts are
  # downloaded from Google Fonts into .cache/plugin/social on the first build.
  # DVQ_SOCIAL_CARDS=false builds without them (the CI's explorer check does not need them).
  - social:
      enabled: !ENV [DVQ_SOCIAL_CARDS, true]
      cards_layout_dir: layouts
      cards_layout: dvq

hooks:
  - hooks/questions.py

# Rebuild on `mkdocs serve` when the demos / tests change
watch:
  - tests
  - tools

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3            # parts (h3) in the sidebar; solution block labels (h4) stay out
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: wavedrom
          class: wavedrom
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |   # notes for whoever edits the site, not pages; Python's cache of py_run.py (the tests)
  stylesheets/README.md
  __pycache__/

extra_css:   # the site's styles in parts, in this order (see docs/stylesheets/README.md); the hook
             # joins them into stylesheets/site.css at build time, and the pages load that one file
  - stylesheets/01-base.css
  - stylesheets/02-pages.css
  - stylesheets/03-runner-figures.css
  - stylesheets/04-solutions.css
  - stylesheets/05-tools-home.css
  - stylesheets/06-figures.css
  - stylesheets/07-reading-aids.css
  - stylesheets/08-explorers.css
  - stylesheets/09-redesign.css
  - stylesheets/10-rounds-w.css
  - stylesheets/11-questions.css
  - stylesheets/12-rounds-y-s.css
  - stylesheets/13-motion.css
  - stylesheets/14-layout.css
  - stylesheets/15-home.css
  - stylesheets/16-maps.css
  - stylesheets/17-lists.css
  - stylesheets/18-question.css
  - stylesheets/19-details.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  # WaveDrom and its init script are added by hooks/questions.py to the pages that have a
  # ```wavedrom block only (S423).
  - javascripts/marks.js
  - javascripts/question-filter.js
  - javascripts/question-tools.js
  - javascripts/run-python.js
  - javascripts/reading-tools.js
  - javascripts/home.js
  - javascripts/selfcheck.js
  - javascripts/motion.js
  - javascripts/layout.js
  - javascripts/home-extras.js
  - javascripts/maps.js
  - javascripts/level-page.js
  - javascripts/question-page.js
  - javascripts/details.js
  # The explorer boxes (docs/javascripts/explorer/) are added per page by hooks/questions.py.


# Navigation is generated by hooks/questions.py from the files under docs/questions/.
