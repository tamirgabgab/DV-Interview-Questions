site_name: שאלות ראיון DV
site_description: אוסף שאלות ראיון עבודה ב-Design Verification עם פתרונות מלאים
repo_url: https://github.com/tamirgabgab/DV-Interview-Questions
repo_name: DV-Interview-Questions
edit_uri: edit/main/docs/

theme:
  name: material
  language: he
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Rubik
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: מצב כהה
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: מצב בהיר
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit

copyright: >
  שאלות ראיון DV &middot;
  <a href="https://github.com/tamirgabgab/DV-Interview-Questions">קוד המקור ב-GitHub</a>

extra:
  generator: false

plugins:
  - search:
      lang: en
  - tags

hooks:
  - hooks/questions.py

# Rebuild on `mkdocs serve` when the demos / tests change
watch:
  - tests
  - tools

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: wavedrom
          class: wavedrom
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.5.0/skins/default.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.5.0/wavedrom.min.js
  - javascripts/wavedrom-init.js
  - javascripts/question-filter.js
  - javascripts/run-python.js


# Navigation is generated by hooks/questions.py from the files under docs/questions/.
