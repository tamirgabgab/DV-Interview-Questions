name: Build and deploy site

# A push or pull request that changes only these files (none of them is part of the site)
# runs nothing.
on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "CONTRIBUTING.md", "CLAUDE.md", "notes/**"]
  pull_request:
    paths-ignore: ["README.md", "CONTRIBUTING.md", "CLAUDE.md", "notes/**"]
  workflow_dispatch:
    inputs:
      phone_dark:
        description: "Also run the phone check in dark mode (screenshots as phone-screenshots-dark)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read            # the gate looks up the runs of the same commit and of the branch

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development snapshot after 5.052: the release crashes on the 0011 class and leaves
  # shapes of the 0014 subclass unrandomized; this commit runs every class as published.
  VERILATOR_REF: "7a5509c89b1dd55cf78809907729a55f7fef55b7"

# The runner image is pinned: ubuntu-latest moved to 26.04 (October 2026), where
# Playwright 1.56 cannot install Chromium, and the Verilator cache was built on 24.04.
# Every job has a timeout of about twice its usual time, so a hung browser or simulator
# fails the run instead of holding it for GitHub's six hours.
jobs:
  # main is fast-forwarded to a commit that passed every check on its work branch, so a push
  # to main whose commit already has a successful run on another branch only builds and
  # deploys (the tests, the phone check and the explorer check are skipped).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5   # usually a few seconds
    outputs:
      verified: ${{ steps.check.outputs.verified }}
      fast: ${{ steps.text.outputs.fast }}
      ids: ${{ steps.text.outputs.ids }}
      pages: ${{ steps.text.outputs.pages }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified=false
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref }}" = refs/heads/main ]; then
            # filter on conclusion here: the API's status=success filter can miss recent runs
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?head_sha=${{ github.sha }}&event=push" \
                  --jq '[.workflow_runs[] | select(.head_branch != "main" and .conclusion == "success")] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then verified=true; fi
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          echo "this commit already passed on a work branch: $verified"
      # The fast lane: a push that changes only the prose of question pages (or only files
      # outside the site, the videos and the notes) runs the lint, the build, the links, the
      # touched questions' Python tests and the phone check of the touched pages, a few
      # minutes, instead of every check (tools/checks/text_only.py, CONTRIBUTING.md "The fast lane").
      # The history is fetched without file contents; git reads the two versions it compares.
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          filter: blob:none
      # The base is the commit of the last run on this branch that passed, not the previous
      # push: a push whose run failed or was cancelled must not slip its code through behind
      # a later prose-only push. No such run (a new branch) or a commit no longer in the
      # history (a force push) gives the full lane.
      - id: text
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then
            base=$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=${{ github.ref_name }}&event=push&per_page=30" \
                     --jq '[.workflow_runs[] | select(.conclusion == "success")][0].head_sha // ""' || echo "")
            echo "last passing run on ${{ github.ref_name }}: ${base:-none}"
            python3 tools/checks/text_only.py "$base" "${{ github.sha }}" --github
          else
            echo "fast=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: gate
    if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45   # usually 8 min, about 25 more when the Verilator cache misses and it is built
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/site.txt -r requirements/dev.txt
      # Node runs the math of the interactive explorers against the Python reference
      # (tests/0026 to tests/0028 and the Josephus tests); without it those tests skip.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Verilator built from source at a pinned commit (the apt package is 5.020, which
      # cannot run randomize() with constraints); the install tree is cached per commit.
      # z3 is the SMT solver Verilator calls for constrained randomization.
      - uses: actions/cache@v6
        id: verilator
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_REF }}-${{ runner.os }}
      - name: Build Verilator (pinned commit)
        if: steps.verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git help2man perl python3 make autoconf g++ flex bison \
            libfl2 libfl-dev zlib1g zlib1g-dev
          git init -q /tmp/verilator
          cd /tmp/verilator
          git fetch -q --depth 1 https://github.com/verilator/verilator.git "${{ env.VERILATOR_REF }}"
          git checkout -q FETCH_HEAD
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install
      - name: Install z3 and the Verilator run-time dependencies
        run: |
          # The runner could not resolve any Ubuntu archive for hours on 2026-11-11. Try
          # apt twice (the second time on archive.ubuntu.com directly); if it still fails,
          # take z3 from its GitHub release (libfl2 is not linked by verilator_bin).
          ok=
          for i in 1 2; do
            if sudo apt-get update -q && sudo apt-get install -y -q z3 perl libfl2; then
              ok=1; break
            fi
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "apt failed: z3 4.8.12 from github.com/Z3Prover/z3/releases"
            z=z3-4.8.12-x64-glibc-2.31
            curl -fsSL --retry 5 -o /tmp/z3.zip \
              "https://github.com/Z3Prover/z3/releases/download/z3-4.8.12/$z.zip"
            unzip -q /tmp/z3.zip "$z/bin/*" -d "$HOME"
            echo "$HOME/$z/bin" >> "$GITHUB_PATH"
            echo "LD_LIBRARY_PATH=$HOME/$z/bin${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
      - run: verilator --version && z3 --version
      # Compiled testbenches are cached by content hash; only changed ones recompile.
      - uses: actions/cache@v6
        with:
          path: .cache/sv
          key: sv-${{ runner.os }}-${{ hashFiles('tests/**', 'docs/questions/**') }}
          restore-keys: sv-${{ runner.os }}-
      - name: Lint the question pages (structure and RTL rules)
        run: python tools/checks/lint_pages.py
      # The tutorial videos' fields on the pages and the captions of videos/*/script.md.
      - name: Check the video fields and the script captions
        run: python tools/checks/check_videos.py
      # Every text and mark colour pair of the site, light and dark, against WCAG 2.
      - name: Check the colour contrast of both schemes
        run: python tools/checks/check_contrast.py
      - name: Run question tests (Python + SystemVerilog)
        run: python tools/checks/run_tests.py

  # The fast lane's checks of prose: the lint, the video fields and captions, and the Python
  # tests of the touched questions (a test may read the page's text). No Verilator: the
  # code blocks are the same as before.
  quick:
    needs: gate
    if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # usually 2 min
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/site.txt -r requirements/dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Lint the question pages (structure and RTL rules)
        run: python tools/checks/lint_pages.py
      - name: Check the video fields and the script captions
        run: python tools/checks/check_videos.py
      - name: Run the touched questions' Python tests
        if: needs.gate.outputs.ids != ''
        run: python tools/checks/run_tests.py --python-only ${{ needs.gate.outputs.ids }}

  build:
    needs: [gate, test, quick]
    if: ${{ !cancelled() && needs.gate.result == 'success' && (needs.test.result == 'success' || needs.gate.outputs.verified == 'true' || (needs.gate.outputs.fast == 'true' && needs.quick.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25   # usually 5 min, about 9 with the dark phone check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/site.txt
      # Social cards: libcairo for cairosvg (the logo on the card); the rendered cards and the
      # fonts downloaded from Google Fonts are cached, keyed on the pages and the layout.
      - name: Install libcairo2
        run: |
          # As in the test job: fall back to archive.ubuntu.com when the Azure mirror fails,
          # and go on if the runner image already has the library.
          for i in 1 2; do
            if sudo apt-get update -q && sudo apt-get install -y -q libcairo2; then exit 0; fi
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://security.ubuntu.com/ubuntu/\tpriority:2\n' \
              | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            sleep 20
          done
          ldconfig -p | grep -q 'libcairo.so.2 ' && echo "apt failed, but libcairo.so.2 is present"
      - uses: actions/cache@v6
        with:
          path: .cache/plugin/social
          key: social-${{ hashFiles('docs/**/*.md', 'tools/build/social/**', 'mkdocs.yml') }}
          restore-keys: social-
      # --strict also fails on invalid question front matter (see hooks/questions.py).
      - run: mkdocs build --strict
      - name: Check internal links and anchors
        run: python tools/checks/check_links.py site
      # The statements' search text of every built page has no TeX left (the test skips
      # where no site was built, so it runs here, after the build).
      - name: Check the search text of the built pages
        run: |
          pip install -q "$(grep '^pytest==' requirements/dev.txt)"
          python -m pytest -q tests/tools/test_search_text.py
      # Every page at 390 px with all blocks open: no sideways scroll, no script errors.
      # axe-core runs on each page too: a serious or critical violation fails, and so does SVG
      # text under 9 px.
      - name: Install Playwright, Chromium and axe-core for the phone check
        if: needs.gate.outputs.verified != 'true' && (needs.gate.outputs.fast != 'true' || needs.gate.outputs.pages != '')
        run: |
          pip install -r requirements/dev.txt
          # --with-deps needs apt; when the Ubuntu archives are unreachable (2026-11-11) the
          # runner image's own libraries are enough for Chromium.
          python -m playwright install --with-deps chromium || python -m playwright install chromium
          npm install --no-save --no-audit --no-fund axe-core@4.14.0
      - name: Check every page at phone width
        if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
        run: python tools/checks/check_phone.py site --shots phone-shots --axe node_modules/axe-core/axe.min.js --axe-fail --small-fail
      # The fast lane: only the pages whose prose changed, with screenshots to look at.
      - name: Check the touched pages at phone width
        if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast == 'true' && needs.gate.outputs.pages != ''
        run: python tools/checks/check_phone.py site --only "${{ needs.gate.outputs.pages }}" --shots phone-shots --axe node_modules/axe-core/axe.min.js --axe-fail --small-fail
      # The 404 page as GitHub Pages serves it (under the site's path), at both widths, and a
      # keyboard pass over a few pages: the tab order, visible focus, names, and the keys of
      # the hints, folds, boxes, figures, the run panel and the search.
      - name: Check the 404 page under the site's path
        if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
        run: python tools/checks/check_404.py site --axe node_modules/axe-core/axe.min.js
      - name: Check the keyboard paths
        if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
        run: python tools/checks/check_keyboard.py site
      # Every box measured at 1920 x 1080: the boxes taller than one screen are listed (a
      # warning only, the owner's choice; tools/checks/check_heights.py).
      - name: Measure the explorer boxes on a computer screen
        if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
        run: python tools/checks/check_heights.py site
      - uses: actions/upload-artifact@v7
        if: always() && needs.gate.outputs.verified != 'true'
        with:
          name: phone-screenshots
          path: phone-shots
          retention-days: 7
          if-no-files-found: ignore
      # Dark mode on request only (Actions → Run workflow → phone_dark), it doubles the check time.
      - name: Check every page at phone width in dark mode
        if: github.event_name == 'workflow_dispatch' && inputs.phone_dark
        run: python tools/checks/check_phone.py site --scheme dark --shots phone-shots-dark --axe node_modules/axe-core/axe.min.js --axe-fail --small-fail
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'workflow_dispatch' && inputs.phone_dark
        with:
          name: phone-screenshots-dark
          path: phone-shots-dark
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  # Every explorer box clicked through, each button once, then "reset everything": a script
  # error or a page that turns wider than 390 px fails the deploy. Then each box's link and
  # remembered state reopen the same controls. Four runners, each a quarter of the boxes.
  explorers:
    needs: [gate, test]
    if: needs.gate.outputs.verified != 'true' && needs.gate.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # usually 15 to 18 min with 92 questions; a slow Chromium install adds up to 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/site.txt -r requirements/dev.txt
      - run: mkdocs build --strict
        env:
          DVQ_SOCIAL_CARDS: "false"
      - run: python -m playwright install --with-deps chromium || python -m playwright install chromium
      - name: Click through the explorer boxes, part ${{ matrix.shard }} of 4
        run: python tools/checks/check_explorers.py site --shard ${{ matrix.shard }}/4
      # Every box stepped from its first step to its last at 390 and 1200 px: a figure that
      # moves while the box steps fails (tools/checks/check_jumps.py).
      - name: Step the explorer boxes for jumping figures, part ${{ matrix.shard }} of 4
        run: python tools/checks/check_jumps.py site --shard ${{ matrix.shard }}/4
      # Every number and text field of every box typed into: Enter, Tab and an input
      # method's Enter must apply the value (tools/checks/check_inputs.py).
      - name: Type into the explorer boxes' fields, part ${{ matrix.shard }} of 4
        run: python tools/checks/check_inputs.py site --shard ${{ matrix.shard }}/4

  deploy:
    needs: [gate, build, explorers]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' && (needs.explorers.result == 'success' || needs.gate.outputs.verified == 'true' || needs.gate.outputs.fast == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10   # usually 1 min
    permissions:          # only the deploy writes to Pages; the other jobs read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
