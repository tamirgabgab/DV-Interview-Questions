name: Build and deploy site

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      phone_dark:
        description: "Also run the phone check in dark mode (screenshots as phone-screenshots-dark)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Development snapshot after 5.052: the release crashes on the 0011 class and leaves
  # shapes of the 0014 subclass unrandomized; this commit runs every class as published.
  VERILATOR_REF: "7a5509c89b1dd55cf78809907729a55f7fef55b7"

# The runner image is pinned: ubuntu-latest moved to 26.04 (October 2026), where
# Playwright 1.56 cannot install Chromium, and the Verilator cache was built on 24.04.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Node runs the math of the interactive explorers against the Python reference
      # (tests/0026 to tests/0028 and the Josephus tests); without it those tests skip.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Verilator built from source at a pinned commit (the apt package is 5.020, which
      # cannot run randomize() with constraints); the install tree is cached per commit.
      # z3 is the SMT solver Verilator calls for constrained randomization.
      - uses: actions/cache@v4
        id: verilator
        with:
          path: ~/verilator
          key: verilator-${{ env.VERILATOR_REF }}-${{ runner.os }}
      - name: Build Verilator (pinned commit)
        if: steps.verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q git help2man perl python3 make autoconf g++ flex bison \
            libfl2 libfl-dev zlib1g zlib1g-dev
          git init -q /tmp/verilator
          cd /tmp/verilator
          git fetch -q --depth 1 https://github.com/verilator/verilator.git "${{ env.VERILATOR_REF }}"
          git checkout -q FETCH_HEAD
          autoconf
          ./configure --prefix="$HOME/verilator"
          make -j"$(nproc)"
          make install
      - name: Install z3 and the Verilator run-time dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q z3 perl libfl2
          echo "$HOME/verilator/bin" >> "$GITHUB_PATH"
      - run: verilator --version && z3 --version
      # Compiled testbenches are cached by content hash; only changed ones recompile.
      - uses: actions/cache@v4
        with:
          path: .cache/sv
          key: sv-${{ runner.os }}-${{ hashFiles('tests/**', 'docs/questions/**') }}
          restore-keys: sv-${{ runner.os }}-
      - name: Lint the question pages (structure and RTL rules)
        run: python tools/lint_pages.py
      - name: Run question tests (Python + SystemVerilog)
        run: python tools/run_tests.py

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Social cards: libcairo for cairosvg (the logo on the card); the rendered cards and the
      # fonts downloaded from Google Fonts are cached, keyed on the pages and the layout.
      - run: sudo apt-get update -q && sudo apt-get install -y -q libcairo2
      - uses: actions/cache@v4
        with:
          path: .cache/plugin/social
          key: social-${{ hashFiles('docs/**/*.md', 'layouts/**', 'mkdocs.yml') }}
          restore-keys: social-
      # --strict also fails on invalid question front matter (see hooks/questions.py).
      - run: mkdocs build --strict
      - name: Check internal links and anchors
        run: python tools/check_links.py site
      # Every page at 390 px with all blocks open: no sideways scroll, no script errors.
      # axe-core runs on each page too and reports serious / critical violations as warnings.
      - name: Install Playwright, Chromium and axe-core for the phone check
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          npm install --no-save --no-audit --no-fund axe-core@4.14.0
      - name: Check every page at phone width
        run: python tools/check_phone.py site --shots phone-shots --axe node_modules/axe-core/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-screenshots
          path: phone-shots
          retention-days: 7
          if-no-files-found: ignore
      # Every explorer box clicked through, each button once, then "reset everything":
      # a script error or a page that turns wider than 390 px fails the deploy. Then each
      # box's link and remembered state reopen the same controls.
      - name: Click through every explorer box
        run: python tools/check_explorers.py site
      # Dark mode on request only (Actions → Run workflow → phone_dark), it doubles the check time.
      - name: Check every page at phone width in dark mode
        if: github.event_name == 'workflow_dispatch' && inputs.phone_dark
        run: python tools/check_phone.py site --scheme dark --shots phone-shots-dark --axe node_modules/axe-core/axe.min.js
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.phone_dark
        with:
          name: phone-screenshots-dark
          path: phone-shots-dark
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
